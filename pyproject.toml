[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rotas-medicas"
version = "0.1.0"
description = "Tech Challenge Fase 2 - algoritmo genético e LLM para logística hospitalar"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3", "pandas>=2,<4", "matplotlib>=3.9,<4",
  "plotly>=6,<7", "networkx>=3.4,<4", "osmnx>=2.0,<3",
  "ortools>=9.12,<10", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3", "openai>=1.70,<3", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.28,<1"]
notebooks = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
report = ["python-docx==1.2.0", "pillow==12.3.0"]

[project.scripts]
tc2 = "rotas_medicas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
